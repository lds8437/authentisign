<template>
    <lightning-card title="Authentisign Integration" icon-name="custom:custom14">
        <div class="slds-p-around_medium">
            <!-- Button with custom icon to open modal and trigger redirect -->
            <lightning-button
                variant="brand"
                label="Launch Authentisign"
                icon-name="utility:open"
                icon-position="left"
                onclick={openModal}
            ></lightning-button>

            <!-- Modal for authentisignContentConfig and Name input form -->
            <template if:true={isModalOpen}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <!-- Modal Header -->
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Authentisign Signing</h2>
                        </header>
                        <!-- Modal Body -->
                        <div class="slds-modal__content slds-p-around_medium">
                            <!-- Simple form with Name input -->
                            <lightning-input
                                type="text"
                                label="Name"
                                value={nameInput}
                                onchange={handleNameChange}
                                class="slds-m-bottom_medium"
                            ></lightning-input>
                            <!-- Authentisign Content Config -->
                            <c-authentisign-content-config
                                record-id={recordId}
                                object-name={objectName}
                                signing-id={signingId}
                                external-id={externalId}
                                onautoredirect={handleAutoRedirect}
                            ></c-authentisign-content-config>
                        </div>
                        <!-- Modal Footer -->
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
    </lightning-card>
</template>
