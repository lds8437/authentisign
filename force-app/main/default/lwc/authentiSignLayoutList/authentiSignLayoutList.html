<template>
    <lightning-card title="AuthentiSign Layouts" icon-name="standard:document">
        <!-- Add Create New Template button in the header -->
        <div slot="actions">
            <lightning-button-icon
                icon-name="utility:add"
                variant="border-filled"
                alternative-text="Create New Template"
                title="Create New Template"
                onclick={handleCreateTemplate}
                class="slds-m-right_x-small"
            ></lightning-button-icon>
        </div>

        <div class="slds-p-around_medium">
            <lightning-radio-group
                name="layoutOrDocument"
                label="Select an Option"
                options={radioOptions}
                value={selectedOption}
                onchange={handleChangeRadio}
                type="radio"
            ></lightning-radio-group>

            <template if:true={isDocumentSelected}>
                <lightning-combobox
                    name="ddlDocuments"
                    label="Select Document"
                    value={selectedDocument}
                    placeholder="Select Document"
                    options={documents}
                    onchange={handleChangeDocument}
                    disabled={documentSigningId}
                ></lightning-combobox>
                <template if:true={documentSigningId}>
                    <lightning-layout multiple-rows="true">
                        <lightning-layout-item size="12">
                            <p>Status: <lightning-badge label={documentSigningStatus}></lightning-badge></p>
                        </lightning-layout-item>
                        <lightning-layout-item size="12">
                            <lightning-button-icon
                                variant="border-filled"
                                icon-name="utility:download"
                                title="Preview"
                                onclick={displayPdfDocument}
                            ></lightning-button-icon>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
                <div class={startDocumentButtonClass}>
                    <lightning-button
                        variant="brand"
                        label="Start"
                        title="Start"
                        onclick={navigateToSigners}
                    ></lightning-button>
                </div>
            </template>

            <template if:false={isDocumentSelected}>
                <lightning-combobox
                    name="ddlLayout"
                    label="Select Layout"
                    value={selectedRecord}
                    placeholder="Select Layout"
                    options={layouts}
                    onchange={handleLayoutChange}
                    disabled={savedLayoutId}
                ></lightning-combobox>
                <template if:true={savedLayoutId}>
                    <lightning-layout multiple-rows="true">
                        <lightning-layout-item size="12">
                            <p>Status: <lightning-badge label={signingStatus}></lightning-badge></p>
                        </lightning-layout-item>
                        <lightning-layout-item size="12">
                            <lightning-button-icon
                                variant="border-filled"
                                icon-name="utility:download"
                                title="Preview"
                                onclick={displayPdf}
                            ></lightning-button-icon>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>
                <div class={startButtonClass}>
                    <lightning-button
                        variant="brand"
                        label="Start"
                        title="Start"
                        onclick={navigateToMappings}
                    ></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
