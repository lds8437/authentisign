<template>
    <lightning-card title="AuthentiSign Layouts" icon-name="custom:custom14">
        <div class="slds-p-around_medium">
            <!-- Loading Spinner -->
            <template if:true={spinner}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

            <!-- Error Display -->
            <template if:true={error}>
                <div class="slds-text-color_error slds-m-bottom_medium">{error}</div>
                <template if:true={showRetryButton}>
                    <lightning-button
                        variant="brand"
                        label="Retry Loading Layouts"
                        onclick={handleRetry}
                        class="slds-m-top_small"
                    ></lightning-button>
                </template>
            </template>

            <!-- Main Content -->
            <template if:false={spinner}>
                <!-- Radio Group for Document/Layout Selection -->
                <lightning-radio-group
                    name="docOrLayout"
                    label="Select Type"
                    options={radioOptions}
                    value={selectedOption}
                    type="radio"
                    onchange={handleChangeRadio}
                    class="slds-m-bottom_medium"
                ></lightning-radio-group>

                <!-- Layout Section -->
                <template if:false={isDocumentSelected}>
                    <div class="slds-box slds-m-bottom_medium">
                        <lightning-combobox
                            name="layout"
                            label="Layouts"
                            value={selectedRecord}
                            placeholder="Select Layout"
                            options={layouts}
                            onchange={handleLayoutChange}
                            disabled={isLayoutSigned}
                        ></lightning-combobox>
                        <p class="slds-m-top_small">
                            <strong>Status:</strong> {signingStatus}
                        </p>
                        <template if:false={isLayoutSigned}>
                            <lightning-button
                                variant="brand"
                                label="Create New Template"
                                onclick={handleCreateTemplate}
                                class={startButtonClassWithMargin}
                            ></lightning-button>
                            <lightning-button
                                variant="neutral"
                                label="Map Fields and Roles"
                                onclick={navigateToMappings}
                                class={startButtonClassWithMargin}
                            ></lightning-button>
                        </template>
                        <lightning-button
                            variant="neutral"
                            label="Display PDF"
                            onclick={displayPdf}
                            class="slds-m-top_small"
                        ></lightning-button>
                    </div>
                </template>

                <!-- Document Section -->
                <template if:true={isDocumentSelected}>
                    <div class="slds-box slds-m-bottom_medium">
                        <lightning-combobox
                            name="document"
                            label="Documents"
                            value={selectedDocument}
                            placeholder="Select Document"
                            options={documents}
                            onchange={handleChangeDocument}
                            disabled={isDocumentSigned}
                        ></lightning-combobox>
                        <p class="slds-m-top_small">
                            <strong>Status:</strong> {documentSigningStatus}
                        </p>
                        <template if:false={isDocumentSigned}>
                            <lightning-button
                                variant="brand"
                                label="Select Signers"
                                onclick={navigateToSigners}
                                class={startDocumentButtonClassWithMargin}
                            ></lightning-button>
                        </template>
                        <lightning-button
                            variant="neutral"
                            label="Display PDF"
                            onclick={displayPdfDocument}
                            class="slds-m-top_small"
                        ></lightning-button>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
