<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading signing interface..." size="medium"></lightning-spinner>
    </template>

    <template if:false={isLoading}>
        <template if:false={isUrlUnavailable}>
            <div class="slds-text-body_regular slds-m-bottom_medium">
                The Authentisign signing interface is ready. Click below to proceed.
            </div>
            <lightning-button
                variant="brand"
                label="Open Signing Interface"
                onclick={handleRedirect}
            ></lightning-button>
        </template>

        <template if:true={isUrlUnavailable}>
            <div class="slds-text-color_error">{error}</div>
        </template>
    </template>
</template>
